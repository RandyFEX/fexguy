# Pull-request validation: the same checks CLAUDE.md requires before a
# commit ("Before committing"), including the article standard in
# `npm run verify -- --strict` (scripts/check-dist.mjs), run on the built site.
name: Verify site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify -- --strict
